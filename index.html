<!DOCTYPE html>
<html>
<head>
    <title>James's Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 50px;
        }

        button {
            font-size: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #sylvester {
            display: none;
            margin: 30px auto;
            max-width: 400px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>

    <p>This website is hosted on GitHub.</p>

    <button onclick="toggleSylvester()">Show Sylvester</button>

    <img
        id="sylvester"
        src="cartoon_performer.jpg"
        alt="Sylvester the Jester"
    >

    <script>
        function toggleSylvester() {

            const image = document.getElementById("sylvester");
            const button = document.querySelector("button");

            if (image.style.display === "block") {
                image.style.display = "none";
                button.textContent = "Show Sylvester";
            } else {
                image.style.display = "block";
                button.textContent = "Hide Sylvester";
            }

        }
    </script>

</body>
</html>
